<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1528" />
    <title>Magic Rings</title>
    <meta name="description" content="Point your camera at your Magic Rings and watch them come alive." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23ff4fa3'/><rect x='4' y='4' width='8' height='8' fill='%23ffe14d'/></svg>" />
    <style>
      :root { --accent: #ff4fa3; --accent-2: #ffe14d; --ink: #fff; --bg: #1b1528; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; overflow: hidden; }
      #start {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        padding: 24px; text-align: center;
        background: radial-gradient(circle at 50% 30%, #4a2f6e, var(--bg) 70%);
      }
      #start h1 { font-size: 34px; margin: 0; letter-spacing: 0.01em; }
      #start p { margin: 0; opacity: 0.85; max-width: 320px; line-height: 1.4; }
      .gems { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 340px; }
      .gems img { width: 120px; height: 120px; object-fit: contain; border-radius: 22px; image-rendering: auto; box-shadow: 0 4px 14px #0006; animation: bob 2.4s ease-in-out infinite; }
      .gems img:nth-child(2n) { animation-delay: -1.2s; }
      @keyframes bob { 50% { transform: translateY(-6px); } }
      #go {
        font: inherit; font-size: 20px; font-weight: 700; color: #2b1d00; background: var(--accent-2); border: 0; border-radius: 999px;
        padding: 16px 34px; box-shadow: 0 8px 30px #ffe14d55; cursor: pointer;
      }
      #go:active { transform: scale(0.97); }
      .fine { font-size: 12px; opacity: 0.6; }
      #hud { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 5; display: flex; justify-content: center; pointer-events: none; }
      #hud span { background: #1b1528cc; backdrop-filter: blur(6px); padding: 10px 16px; border-radius: 999px; font-size: 15px; transition: opacity 0.3s; }
      #err { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 30px; text-align: center; background: var(--bg); }
      .a-enter-vr, .a-enter-ar { display: none !important; }
      /* ---------- Batroun Capitale de Noël welcome page ---------- */
      @font-face { font-family: 'FestScript'; src: url('./vendor/fonts/GreatVibes-Regular.ttf') format('truetype'); font-display: swap; }
      @font-face { font-family: 'FestCaps'; src: url('./vendor/fonts/Cinzel.ttf') format('truetype'); font-weight: 400 900; font-display: swap; }
      html.batroun { --bg: #1c0508; }
      html.batroun body { background: #1c0508; }
      html.batroun #start {
        gap: 0; justify-content: center; overflow: hidden;
        background:
          radial-gradient(circle at 18% 22%, #ffcf6a26 0 3px, transparent 4px),
          radial-gradient(circle at 82% 14%, #ffcf6a33 0 4px, transparent 5px),
          radial-gradient(circle at 70% 70%, #ffcf6a1f 0 6px, transparent 7px),
          radial-gradient(circle at 12% 80%, #ff6a5a22 0 5px, transparent 6px),
          radial-gradient(ellipse at 50% 38%, #7a1220 0%, #3d0910 48%, #1c0508 100%);
      }
      html.batroun #start::after { content: ''; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 46%, #ffc96a22, transparent 55%); }
      .bx { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; max-width: 360px; width: 100%; }
      .bx .kicker { font: 600 11px/1 FestCaps, Georgia, serif; letter-spacing: .32em; color: #e8c06a; opacity: .9; }
      .bx .script { font: 400 clamp(58px, 18vw, 76px)/1 FestScript, 'Snell Roundhand', cursive; margin: 6px 0 -2px;
        background: linear-gradient(180deg, #fff3c4 0%, #f5c85a 48%, #b98222 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 14px #ffb84a66); }
      .bx .caps { font: 600 clamp(16px, 5vw, 19px)/1.2 FestCaps, Georgia, serif; letter-spacing: .2em; color: #fff1d6; }
      .bx .rule { display: flex; align-items: center; gap: 10px; margin: 12px 0 14px; color: #e8c06a; font: 600 12px FestCaps, serif; letter-spacing: .3em; }
      .bx .rule::before, .bx .rule::after { content: ''; width: 54px; height: 1px; background: linear-gradient(90deg, transparent, #e8c06a); }
      .bx .rule::after { transform: scaleX(-1); }
      .bx .clicker { width: clamp(130px, 40vw, 168px); aspect-ratio: 1; border-radius: 22%; animation: bob 3.2s ease-in-out infinite;
        filter: drop-shadow(0 0 22px #ffb84a88) drop-shadow(0 10px 18px #0009); }
      .bx .invite { margin: 18px 0 4px; font: 400 17px/1.45 Georgia, 'Times New Roman', serif; color: #fff6e6; }
      .bx .invite-en { margin: 0 0 20px; font: italic 400 14px/1.4 Georgia, serif; color: #f3d9b0; opacity: .85; }
      html.batroun #go { font: 700 17px/1 FestCaps, Georgia, serif; letter-spacing: .08em; color: #5a0a14;
        background: linear-gradient(180deg, #fff1c2, #f2c457 55%, #c9902c); padding: 17px 30px; box-shadow: 0 0 0 1px #ffe7a3 inset, 0 10px 34px #ffb84a55; }
      .bx .fine { margin-top: 14px; font: 400 12px/1.4 Georgia, serif; color: #f3d9b0; opacity: .7; }
      .snow { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .snow i { position: absolute; top: -10px; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: .7; animation: fall linear infinite; }
      @keyframes fall { to { transform: translate3d(20px, 105vh, 0); } }
      html.batroun #hud span { background: #3d0910d9; border: 1px solid #e8c06a66; font-family: Georgia, serif; }

    </style>
    <script type="module" crossorigin src="./assets/index-Dl8lHP_c.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <div id="start">
      <h1>✨ Magic Rings ✨</h1>
      <div class="gems" id="gems"></div>
      <p>Hold your hand in good light and point the camera at your rings.</p>
      <button id="go">Wake them up</button>
      <p class="fine">Works in Safari (iPhone) and Chrome (Android). Nothing to install.</p>
    </div>
    <script>
      // Batroun Capitale de Noël has its own welcome page (the default link)
      (function () {
        var c = (new URLSearchParams(location.search).get('c') || 'batroun');
        if (c.indexOf('batroun') !== 0) return;
        document.documentElement.classList.add('batroun');
        document.title = 'Batroun · Capitale de Noël';
        var st = document.getElementById('start');
        st.innerHTML =
          '<div class="snow" id="snow"></div>' +
          '<div class="bx">' +
          '<div class="kicker">BIENVENUE · WELCOME</div>' +
          '<div class="script">Batroun</div>' +
          '<div class="caps">CAPITALE DE NOËL</div>' +
          '<div class="rule">2026</div>' +
          '<img class="clicker" src="./batroun/clicker.png" alt="Batroun Christmas Festival clicker">' +
          '<p class="invite">Nous sommes ravis de vous inviter à <b>Batroun, Capitale de Noël</b>.</p>' +
          '<p class="invite-en">Glad to invite you to Batroun, the Christmas capital of Lebanon.</p>' +
          '<button id="go">Allumer la magie ✨</button>' +
          '<p class="fine">iPhone &amp; Android · rien à installer · nothing to install</p>' +
          '</div>';
        var sn = document.getElementById('snow');
        for (var i = 0; i < 38; i++) {
          var f = document.createElement('i');
          var z = 2 + Math.random() * 4;
          f.style.cssText = 'left:' + (Math.random() * 100) + '%;width:' + z + 'px;height:' + z + 'px;opacity:' + (0.3 + Math.random() * 0.6) + ';animation-duration:' + (7 + Math.random() * 9) + 's;animation-delay:' + (-Math.random() * 16) + 's';
          sn.appendChild(f);
        }
        var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', '#1c0508');
      })();
    </script>
    <div id="hud" hidden><span id="hud-text">Point at your rings 💍</span></div>
    <div id="err"><div><h2>Camera needed</h2><p id="err-text"></p></div></div>
    <script src="./vendor/aframe.min.js"></script>
    <script src="./vendor/mindar-image-aframe.prod.js"></script>
  </body>
</html>
